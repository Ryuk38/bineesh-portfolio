<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="bmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6366F1" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" stroke="url(#bmGradient)" stroke-width="2" />

  <!-- Subtle Radial Glow behind logo -->
  <circle cx="32" cy="32" r="18" fill="#6366F1" opacity="0.15" />

  <!-- Monogram BM -->
  <text 
    x="32" 
    y="42" 
    text-anchor="middle" 
    font-family="system-ui, -apple-system, 'Sora', sans-serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="-1.5"
    fill="url(#bmGradient)"
    filter="url(#glow)"
  >
    BM
  </text>

  <!-- Cyber Accent Dot -->
  <circle cx="50" cy="20" r="3" fill="#06B6D4" />
</svg>

